onboarding = false

[ui]
agent_panel_sort = "priority"

[terminal]
# Use Fish while preserving macOS login shell behavior.
default_shell = "fish"
shell_mode = "auto"
# New panes and tabs start in the current pane's directory.
new_cwd = "follow"

[theme]
name = "kanagawa"
auto_switch = false

[keys]
prefix = "ctrl+q"
split_horizontal = "prefix+v"
split_vertical = "prefix+s"

navigate_workspace_down = "j"
navigate_workspace_up = "k"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
